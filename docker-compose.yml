services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    ports:
      - "8545:8545"
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545"]

  deploy:
    image: ghcr.io/foundry-rs/foundry:latest
    depends_on:
      - anvil
    volumes:
      - ./contracts:/app
    working_dir: /app
    environment:
      - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    entrypoint: >
      sh -c "sleep 3 && forge script script/DeployLocal.s.sol:DeployLocal --rpc-url http://anvil:8545 --broadcast"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_CHAIN_ID=31337
      - VITE_LENDING_POOL_ADDRESS=0x8A791620dd6260079BF849Dc5567aDC3F2FdC318
      - VITE_WETH_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - VITE_USDC_ADDRESS=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512
      - VITE_ORACLE_ADDRESS=0x5FC8d32690cc91D4c39d9d3abcBD16989F875707
    depends_on:
      - deploy
